<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>201Fitful — Dashboard</title>
    <meta name="description" content="Ringkasan harian, mingguan, dan bulanan seluruh pengguna 201Fitful." />
    <meta name="theme-color" content="#0f9d6e" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f9d6e'/%3E%3Cpath d='M28 52l14 14 30-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/dashboard.css" />
  </head>
  <body class="dash-page">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/" aria-label="201Fitful">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="brand-name">201<span>Fitful</span></span>
        </a>
        <a class="btn btn-ghost btn-small" href="/">Aplikasi</a>
      </div>
    </header>

    <main class="dash">
      <div class="dash-head">
        <div>
          <span class="eyebrow" id="dash-today">Hari ini</span>
          <h1>Dashboard</h1>
          <p class="dash-sub">Ringkasan semua pengguna.</p>
        </div>
      </div>

      <section class="dash-summary" id="dash-summary" aria-label="Ringkasan keseluruhan"></section>

      <div class="dash-toolbar">
        <div class="period-switch" id="period-switch" role="tablist" aria-label="Periode ringkasan">
          <button type="button" role="tab" data-period="daily" class="is-active" aria-selected="true">Harian</button>
          <button type="button" role="tab" data-period="weekly" aria-selected="false">Mingguan</button>
          <button type="button" role="tab" data-period="monthly" aria-selected="false">Bulanan</button>
        </div>
        <span class="dash-count" id="user-count"></span>
      </div>

      <div class="dash-users" id="dash-users"></div>
      <p class="dash-empty" id="dash-empty" hidden>Belum ada pengguna.</p>
    </main>

    <script src="/dashboard.js" type="module"></script>
  </body>
</html>
